[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "watchtower-web-monitor"
version = "1.0.1"
description = "A privacy-friendly CLI website change monitor with diffs, selectors, scheduling, and notifications."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Watchtower Contributors"}]
dependencies = [
  "httpx>=0.27,<1",
  "beautifulsoup4>=4.12,<5",
  "typer>=0.12,<1",
  "rich>=13.7,<15",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "respx>=0.21,<1", "ruff>=0.6,<1"]

[project.scripts]
watchtower = "watchtower.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/watchtower"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
