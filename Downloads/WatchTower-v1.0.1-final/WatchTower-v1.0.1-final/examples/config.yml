request:
  timeout_seconds: 15
  user_agent: "Watchtower/1.0 (+local change monitor)"
scheduler:
  poll_seconds: 30
notifications:
  terminal:
    enabled: true
  discord:
    enabled: false
    webhook_env: WATCHTOWER_DISCORD_WEBHOOK
  slack:
    enabled: false
    webhook_env: WATCHTOWER_SLACK_WEBHOOK
  telegram:
    enabled: false
    token_env: WATCHTOWER_TELEGRAM_BOT_TOKEN
    chat_env: WATCHTOWER_TELEGRAM_CHAT_ID
  email:
    enabled: false
    host_env: WATCHTOWER_SMTP_HOST
    port_env: WATCHTOWER_SMTP_PORT
    user_env: WATCHTOWER_SMTP_USER
    password_env: WATCHTOWER_SMTP_PASSWORD
    from_env: WATCHTOWER_EMAIL_FROM
    to_env: WATCHTOWER_EMAIL_TO
    starttls: true
