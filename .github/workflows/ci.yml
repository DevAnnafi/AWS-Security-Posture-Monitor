name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  terraform:
    name: Terraform Checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Check Terraform formatting
        run: terraform -chdir=terraform fmt -check -recursive

      - name: Initialize Terraform
        run: terraform -chdir=terraform init -backend=false

      - name: Validate Terraform
        run: terraform -chdir=terraform validate

  test-python:
    name: Run Pytest Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: zihan_aws_sec
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: security_db
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U zihan_aws_sec -d security_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scanner/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scanner/requirements.txt
          pip install -r api/requirements.txt

      - name: Create database tables
        run: python -m api.db.init
        env:
          POSTGRES_USER: zihan_aws_sec
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: security_db
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5433

      - name: Run pytest
        run: python -m pytest scanner/ -q
        env:
          POSTGRES_USER: zihan_aws_sec
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: security_db
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5433

      